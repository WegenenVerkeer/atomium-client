spring:
  application:
    name: atomium-client-spring-boot-4-it

# The feed url is generic (every app needs it); the test TestFeedRestClientBuilders builds a RestClient from it.
atomium:
  feeds:
    # FooAppFeedHandler
    foo-app:
      url: http://localhost:${wiremock.feed.port}/feed
      # large interval: the behavior test triggers the runs itself; this keeps the scheduler from ticking in between
      query-interval: 1h
      initial-feed-pointer:
        type: oldest
    # FooAppBatchFeedHandler (SimpleProcessingFeedHandler: two-phase processing + accepts)
    foo-app-batch:
      url: http://localhost:${wiremock.feed.port}/feed
      query-interval: 1h
      initial-feed-pointer:
        type: oldest
      processing:
        # small threshold so the dedup/threshold scenarios stay short
        max-size: 3
    # FooAppBatchCapFeedHandler: the threshold is never reached, so only the page safety net can still wrap up a batch
    foo-app-batch-cap:
      url: http://localhost:${wiremock.feed.port}/feed
      query-interval: 1h
      initial-feed-pointer:
        type: oldest
      processing:
        max-size: 100
        max-uncommitted-pages: 2
    # FooAppEmptyPageFeedHandler
    foo-app-empty-page:
      url: http://localhost:${wiremock.feed.port}/feed
      query-interval: 1h
      initial-feed-pointer:
        type: oldest

logging:
  level:
    WireMock: ERROR
